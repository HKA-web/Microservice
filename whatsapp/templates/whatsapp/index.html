<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-ERP WA BOT CLI Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #020617;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .line-hover:hover {
            background-color: rgba(30, 41, 59, 0.5);
        }
    </style>
</head>
<body class="text-slate-300 overflow-hidden select-none">

    <div class="flex flex-col h-screen">
        <header class="h-10 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
            <div class="flex items-center gap-4 text-[11px] font-bold tracking-tight">
                <div class="flex items-center gap-2" id="connection-status-ui">
                    <div id="status-dot" class="w-2 h-2 bg-slate-500 rounded-full"></div>
                    <span id="status-text">SESSION: {{ session_id }} [DISCONNECTED]</span>
                </div>
            </div>

            <div class="flex items-center gap-4 text-[11px] font-bold">
                <div class="flex gap-1">
                    <a href="{{ API_DOCS }}" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 transition-colors">API</a>
                    <button onclick="window.location.reload()" class="px-2 py-0.5 bg-red-900/30 text-red-500 border border-red-900/50 hover:bg-red-900/50 rounded transition-colors">RECONNECT</button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-hidden flex flex-col bg-[#020617] p-4 relative">
            <div class="absolute inset-0 pointer-events-none opacity-[0.03] bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] z-10 bg-[length:100%_2px,3px_100%]"></div>

            <div id="log-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-1 text-[13px] leading-relaxed relative z-0 flex flex-col">
                <div class="flex gap-4 line-hover px-2 py-0.5 rounded">
                    <span class="text-slate-600 shrink-0 uppercase current-time">14:20:01</span>
                    <span class="text-blue-500 font-bold shrink-0">[SYSTEM]</span>
                    <span class="text-slate-400 italic">Initializing NEXUS-ERP WA BOT Monitor Engine...</span>
                </div>
                <div id="active-logs" class="contents"></div>

                <div id="cursor-line" class="flex gap-4 px-2 py-2">
                    <span class="text-emerald-500 font-bold tracking-widest animate-pulse">root@whastapp-bot:~#</span>
                    <span id="listening-text" class="text-slate-200">Connecting to socket...<span class="w-2 h-4 bg-emerald-500 inline-block ml-1 cursor-blink align-middle"></span></span>
                </div>
            </div>
        </main>

        <footer class="h-8 bg-[#1e293b] flex items-center px-4 justify-between shrink-0">
            <div class="flex gap-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="link-2" class="w-3 h-3"></i>
                    <span>Socket: <span id="socket-status">Inactive</span></span>
                </div>
            </div>
            <div class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">
                MAKE WITH ❤️ H.K.A
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // 1. Sinkronisasi Session ID
        // Gunakan nilai dinamis dari Django, default ke 6285648007953 jika tidak ada
        const sessionId = "{{ session_id }}";
        const logContainer = document.getElementById('active-logs');
        const scrollContainer = document.getElementById('log-container');
        const listeningText = document.getElementById('listening-text');

        // 2. Inisialisasi WebSocket
        const socket = new WebSocket(`ws://${window.location.host}/ws/whatsapp/${sessionId}/`);

        function getTimestamp() {
            return new Date().toLocaleTimeString('en-GB', { hour12: false });
        }

        function appendLog(type, label, content, colorClass, subContent = null) {
            const time = getTimestamp();
            const logEntry = document.createElement('div');
            logEntry.className = "flex flex-col mb-1 animate-in fade-in slide-in-from-left duration-300";

            let html = `
                <div class="flex gap-4 line-hover px-2 py-0.5 rounded">
                    <span class="text-slate-600 shrink-0 uppercase">${time}</span>
                    <span class="${colorClass} font-bold shrink-0">[${label}]</span>
                    <span class="text-slate-300">${content}</span>
                </div>
            `;

            if (subContent) {
                html += `
                <div class="flex gap-4 line-hover px-2 py-0.5 rounded ml-24">
                    <span class="text-slate-500 shrink-0">↳ CONTENT:</span>
                    <span class="text-slate-200">"${subContent}"</span>
                </div>
                `;
            }

            logEntry.innerHTML = html;
            logContainer.appendChild(logEntry);

            // Auto Scroll ke bawah
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        socket.onopen = () => {
            document.getElementById('status-dot').className = "w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.6)]";
            document.getElementById('connection-status-ui').className = "flex items-center gap-2 text-emerald-500";
            document.getElementById('status-text').innerText = `SESSION: ${sessionId} [CONNECTED]`;
            document.getElementById('socket-status').innerText = "Active";
            document.getElementById('socket-status').className = "text-emerald-500";
            listeningText.innerText = "Listening for new events...";

            appendLog('SYSTEM', 'WS', `Successfully connected to channel session.${sessionId}`, 'text-blue-500');
        };

        socket.onmessage = function (e) {
            const response = JSON.parse(e.data);
            console.log("📩 Received:", response);

            if (response.type === 'new_message') {
                const data = response.content;
                const sender = data.push_name || "Unknown";
                const message = data.text || "(Media/Non-text message)";

                appendLog('INBOUND', 'INCOMING', `MSG_RECEIVED | FROM: <span class="text-blue-400">${sender}</span>`, 'text-purple-500', message);

                setTimeout(() => {
                    appendLog('WEBHOOK', 'POST', `ws://${window.location.host}/ws/whatsapp/ ... <span class="text-emerald-500 font-bold">200 OK</span>`, 'text-orange-500');
                }, 200);
            }
        };

        socket.onclose = () => {
            document.getElementById('status-dot').className = "w-2 h-2 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.6)]";
            document.getElementById('status-text').innerText = `SESSION: ${sessionId} [TERMINATED]`;
            document.getElementById('socket-status').innerText = "Disconnected";
            document.getElementById('socket-status').className = "text-red-500";
            listeningText.innerHTML = `<span class="text-red-500 font-bold">Connection lost. Waiting for manual restart...</span>`;

            appendLog('ERROR', 'CRITICAL', "WebSocket connection closed unexpectedly.", 'text-red-500');
        };
    </script>
</body>
</html>
