<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>QR WhatsApp</title>
  <meta http-equiv="refresh" content="5">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center p-6">

  <div class="bg-white shadow-2xl rounded-2xl p-8 max-w-md w-full text-center">

    <h2 class="text-2xl font-bold text-gray-800 mb-2">
      📱 QR Code WhatsApp
    </h2>

    <p class="text-gray-500 text-sm mb-6">
      Scan QR ini menggunakan aplikasi WhatsApp di HP kamu
    </p>

    <div class="flex justify-center mb-4">
      <img 
        id="qrImage" 
        src="" 
        alt="QR Code WhatsApp"
        class="w-72 h-72 border-4 border-emerald-500 rounded-xl shadow-md object-contain bg-white p-2"
      >
    </div>

    <div id="status" class="text-sm text-gray-400">
      🔄 Menunggu QR terbaru...
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const phone = params.get("phone");

    if (!phone) {
      document.body.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-red-50">
          <div class="bg-white p-8 rounded-xl shadow-lg text-center">
            <h3 class="text-red-600 font-bold text-lg">
              ❌ Parameter ?phone=62xxx wajib.
            </h3>
          </div>
        </div>
      `;
    } else {
      document.getElementById("qrImage").src = `/wa/qr/view?phone=${phone}`;
    }
  </script>

</body>
</html>
